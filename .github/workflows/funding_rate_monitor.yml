name: Funding Rate Monitor

on:
  schedule:
    # Run every 15 minutes.
    - cron: "*/15 * * * *"
  workflow_dispatch:

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install ".[dev]"

      - name: Restore cooldown state
        uses: actions/cache@v4
        with:
          path: cooldown_state.json
          # Restore from any previous run; update the cache every run.
          key: cooldown-state-${{ github.run_id }}
          restore-keys: |
            cooldown-state-

      - name: Run funding rate monitor
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          THRESHOLD_PCT: ${{ vars.THRESHOLD_PCT || '0.01' }}
          TOP_N: ${{ vars.TOP_N || '20' }}
          COOLDOWN_MINUTES: ${{ vars.COOLDOWN_MINUTES || '60' }}
          ENABLE_EXCHANGES: ${{ vars.ENABLE_EXCHANGES || '' }}
        run: python -m funding_rate_monitor

      - name: Save cooldown state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: cooldown_state.json
          key: cooldown-state-${{ github.run_id }}

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dev dependencies
        run: pip install ".[dev]"

      - name: Run tests
        run: pytest -v
